<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How is coal made? An animated story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EAE5; --ink:#1E2923; --ink-2:#4B5B51; --bar:#FFFFFF; --line:#C8D5CC; --accent:#2E6A4E; --accent-ink:#FFFFFF; --focus:#D2692E; --seg:#D6E1D9;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1311; --ink:#E5EDE7; --ink-2:#A6B5AB; --bar:#1A211D; --line:#2D3932; --accent:#7BC29A; --accent-ink:#0F1A14; --focus:#F08A4B; --seg:#222B26; }
}
:root[data-theme="dark"]{ --bg:#0F1311; --ink:#E5EDE7; --ink-2:#A6B5AB; --bar:#1A211D; --line:#2D3932; --accent:#7BC29A; --accent-ink:#0F1A14; --focus:#F08A4B; --seg:#222B26; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5}
.wrap{max-width:1280px; margin:0 auto; padding:16px 16px 32px}

.toolbar{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:center; margin-bottom:14px}
.group{display:flex; align-items:center; gap:8px; font-size:.92rem; color:var(--ink-2)}
.segs{display:flex; background:var(--seg); border-radius:999px; padding:3px}
.segs button{font:600 .9rem "Fredoka","Trebuchet MS",sans-serif; border:0; background:transparent; color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer}
.segs button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
select{font:inherit; font-size:.88rem; color:var(--ink); background:var(--bar); border:1px solid var(--line); border-radius:8px; padding:5px 8px; max-width:210px}
.segs button:focus-visible,select:focus-visible,.btn:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

.player{margin:0 auto; max-width:1280px}
.player.v{max-width:max(300px, min(460px, calc(78vh * 9 / 16)))}
.film{position:relative; width:100%; aspect-ratio:16/9; background:#1B211D; border-radius:14px 14px 0 0; overflow:hidden; outline:none}
.player.v .film{aspect-ratio:9/16}
.film:fullscreen{border-radius:0; aspect-ratio:auto; background:#000}
canvas{display:block; width:100%; height:100%}
.film:focus-visible{box-shadow:0 0 0 3px var(--focus)}

.cap{
  position:absolute; left:50%; bottom:4.5%; transform:translateX(-50%);
  width:max-content; max-width:84%; text-align:center; font-weight:700;
  font-size:var(--capsize,20px); line-height:1.35; color:#FFFFFF;
  background:rgba(14,17,15,0.76); padding:.35em .8em; border-radius:.45em;
  opacity:0; transition:opacity .2s ease; pointer-events:none;
}
.player.v .cap{bottom:17%; max-width:90%}
.cap.show{opacity:1}
.cap.off{display:none}
.chapter{
  position:absolute; left:2.2%; top:3.5%; font-family:"Fredoka","Trebuchet MS",sans-serif; font-weight:600;
  font-size:calc(var(--capsize,20px) * .72); color:#FFFFFF; background:rgba(14,17,15,0.55);
  padding:.25em .75em; border-radius:999px; opacity:0; transition:opacity .3s; pointer-events:none;
}
.player.v .chapter{left:4%; top:3%}
.chapter.show{opacity:1}
.start{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:transparent; border:0; cursor:pointer; padding:0}
.start span{font:600 calc(var(--capsize,20px) * 1.05) "Fredoka","Trebuchet MS",sans-serif; color:#1B211D; background:#FFD166; padding:.6em 1.4em; border-radius:999px; margin-top:24%; box-shadow:0 6px 0 #C79A2E}
.player.v .start span{margin-top:70%}
.start:focus-visible span{outline:3px solid #FFFFFF; outline-offset:3px}
.start[hidden]{display:none}

.controls{display:flex; align-items:center; gap:10px; background:var(--bar); border:1px solid var(--line); border-top:0; border-radius:0 0 14px 14px; padding:8px 12px}
.btn{font:600 .95rem "Fredoka","Trebuchet MS",sans-serif; border:0; border-radius:999px; padding:8px 12px; cursor:pointer; background:transparent; color:var(--ink); min-width:44px}
.btn.primary{background:var(--accent); color:var(--accent-ink); min-width:80px}
.btn[aria-pressed="false"]{color:var(--ink-2); text-decoration:line-through}
.scrub{position:relative; flex:1; min-width:0; height:32px; display:flex; align-items:center}
.ticks{position:absolute; left:0; right:0; top:50%; height:0; pointer-events:none}
.ticks i{position:absolute; top:-9px; width:3px; height:18px; border-radius:2px; background:var(--ink-2); opacity:.55; transform:translateX(-50%)}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:32px; background:transparent; margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px; border-radius:999px; background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px; border-radius:999px; background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; margin-top:-6px; border-radius:50%; background:#FFFFFF; border:3px solid var(--accent); cursor:grab}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:#FFFFFF; border:3px solid var(--accent); cursor:grab}
.clock{font-variant-numeric:tabular-nums; color:var(--ink-2); font-size:.9rem; white-space:nowrap}
.player.v .clock{display:none}
@media (max-width:560px){ .clock{display:none} }
.note{color:var(--ink-2); font-size:.92rem; margin:12px auto 0; max-width:70ch; text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <div class="toolbar">
    <div class="group"><span>Length</span><div class="segs" id="cutSegs"><button type="button" data-cut="short" aria-pressed="true">Under 1 min</button><button type="button" data-cut="full" aria-pressed="false">Full 2:20</button></div></div>
    <div class="group"><span>Frame</span><div class="segs" id="frameSegs"><button type="button" data-frame="v" aria-pressed="true">Vertical 9:16</button><button type="button" data-frame="w" aria-pressed="false">Wide 16:9</button></div></div>
    <div class="group" id="narrGroup"><span>Narration</span><div class="segs" id="narrSegs"><button type="button" data-n="on" aria-pressed="true">On</button><button type="button" data-n="off" aria-pressed="false">Off</button></div><select id="voice" aria-label="Narrator voice"></select></div>
  </div>

  <div class="player v" id="player">
    <div class="film" id="film" tabindex="0" aria-label="Animated film: How is coal made? Space to play or pause, arrow keys to skip.">
      <canvas id="scene" role="img" aria-label="Animation"></canvas>
      <div class="chapter" id="chapter"></div>
      <div class="cap" id="cap" aria-live="polite"></div>
      <button class="start" id="start" type="button" aria-label="Play the film"><span>Play the story</span></button>
    </div>
    <div class="controls">
      <button class="btn primary" id="play" type="button">Play</button>
      <div class="scrub"><div class="ticks" id="ticks"></div><input id="time" type="range" min="0" max="1000" value="0" aria-label="Film timeline"></div>
      <span class="clock" id="clock">0:00</span>
      <button class="btn" id="cc" type="button" aria-pressed="true" title="Captions">CC</button>
      <button class="btn" id="fs" type="button" title="Full screen" aria-label="Full screen">&#x26F6;</button>
    </div>
  </div>
  <p class="note" id="note">Narration uses your browser's built-in voices, so it sounds different on each device. The film waits for the narrator to finish each line.</p>
</main>

<script>
(() => {
'use strict';
// ================= helpers =================
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
let V = true, VW = 900, VH = 1600;
const P = (w, v) => V ? v : w;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x * x * (3 - 2 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const hs = (i, k = 0) => { const x = Math.sin(i * 127.1 + k * 311.7 + 0.5) * 43758.5453; return x - Math.floor(x); };
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (c1, c2, x) => { const a = hexRGB(c1), b = hexRGB(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], clamp(x)))).join(',')})`; };
const stops = (list, x) => { const s = clamp(x) * (list.length - 1), i = Math.min(list.length - 2, Math.floor(s)); return mix(list[i], list[i + 1], s - i); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DISPLAY = 'Fredoka, "Trebuchet MS", sans-serif';
const canvas = $('#scene'), ctx = canvas.getContext('2d');
let T = 0;   // film time
let A = 0;   // ambient clock for idle wobble (keeps moving while narration holds the film)

// ================= primitives =================
function pill(text, x, y, align = 'left', dark = true, size = 26) {
  size *= P(1, 1.3);
  ctx.save(); ctx.font = `600 ${size}px ${DISPLAY}`;
  const tw = ctx.measureText(text).width, ph = size * 1.55, pw = tw + size * 1.1;
  const x0 = align === 'right' ? x - pw : align === 'center' ? x - pw / 2 : x;
  ctx.fillStyle = dark ? 'rgba(20,24,21,0.8)' : 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.roundRect(x0, y - ph / 2, pw, ph, ph / 2); ctx.fill();
  ctx.fillStyle = dark ? '#FFFFFF' : '#1E2923'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(text, x0 + size * 0.55, y + 1); ctx.restore();
}
function fadePill(lt, a, b, text, x, y, align, dark = true, size = 26) { const al = seg(lt, a, a + 0.4) * (1 - seg(lt, b - 0.4, b)); if (al <= 0) return; ctx.save(); ctx.globalAlpha = al; pill(text, x, y, align, dark, size); ctx.restore(); }
function arrow(x1, y1, x2, y2, w = 5, head = 16, col = '#FFFFFF') {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * .8, y2 - Math.sin(a) * head * .8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(a - .5) * head, y2 - Math.sin(a - .5) * head); ctx.lineTo(x2 - Math.cos(a + .5) * head, y2 - Math.sin(a + .5) * head); ctx.closePath(); ctx.fill();
}
function atom(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .3, r * .35, 0, TAU); ctx.fill(); }
const C_COL = '#2A2623', O_COL = '#E0533D';
function co2(x, y, s = 1, rot = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); atom(-22 * s, 0, 11 * s, O_COL); atom(22 * s, 0, 11 * s, O_COL); atom(0, 0, 14 * s, C_COL); ctx.restore(); }
function o2(x, y, s = 1, rot = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); atom(-9 * s, 0, 11 * s, O_COL); atom(9 * s, 0, 11 * s, O_COL); ctx.restore(); }
function microbe(x, y, r, seed, asleep = false, pulse = 0) {
  ctx.save(); ctx.translate(x, y); const sc = 1 + .25 * pulse; ctx.scale(sc, sc);
  const wob = asleep || reduce ? 0 : 1;
  ctx.fillStyle = asleep ? '#8E8A95' : '#9A62D0'; ctx.beginPath();
  for (let k = 0; k <= 24; k++) { const a = k / 24 * TAU, rr = r * (1 + .12 * Math.sin(a * 3 + A * 3 * wob + seed)); const px = Math.cos(a) * rr * 1.25, py = Math.sin(a) * rr; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath(); ctx.fill(); ctx.fillStyle = '#FFFFFF';
  if (asleep) { ctx.strokeStyle = '#2A2623'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-r * .5, -r * .1); ctx.lineTo(-r * .15, -r * .1); ctx.moveTo(r * .15, -r * .1); ctx.lineTo(r * .5, -r * .1); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(-r * .32, -r * .15, r * .22, 0, TAU); ctx.arc(r * .32, -r * .15, r * .22, 0, TAU); ctx.fill(); ctx.fillStyle = '#2A2623'; ctx.beginPath(); ctx.arc(-r * .3, -r * .12, r * .1, 0, TAU); ctx.arc(r * .34, -r * .12, r * .1, 0, TAU); ctx.fill(); }
  ctx.restore();
  if (asleep) { ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.85)'; const bob = reduce ? 0 : Math.sin(A * 2 + seed) * 4; ctx.font = `600 ${r * .9}px ${DISPLAY}`; ctx.fillText('z', x + r * 1.1, y - r * 1.1 + bob); ctx.font = `600 ${r * .65}px ${DISPLAY}`; ctx.fillText('z', x + r * 1.6, y - r * 1.8 + bob); ctx.restore(); }
}
function sun(x, y, r) { ctx.fillStyle = 'rgba(255,209,102,0.28)'; ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, TAU); ctx.fill(); ctx.fillStyle = '#FFD166'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function darkBg(c = '#1B211D') { ctx.fillStyle = c; ctx.fillRect(-10, -10, VW + 20, VH + 20); }
function coalLump(x, y, r, glow) {
  if (glow > 0) { const g = ctx.createRadialGradient(x, y, r * .3, x, y, r * 3); g.addColorStop(0, `rgba(255,190,90,${.55 * glow})`); g.addColorStop(1, 'rgba(255,190,90,0)'); ctx.fillStyle = g; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); }
  const pts = []; for (let k = 0; k < 9; k++) { const a = k / 9 * TAU + .2, rr = r * (.78 + hs(k, 70) * .35); pts.push([x + Math.cos(a) * rr * 1.2, y + Math.sin(a) * rr]); }
  ctx.fillStyle = '#1D1A18'; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 3; for (let k = 0; k < 9; k += 2) { ctx.beginPath(); ctx.moveTo(x - r * .1, y - r * .1); ctx.lineTo(...pts[k]); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x - r * .45, y - r * .45, r * .25, 5); ctx.fillRect(x + r * .2, y - r * .1, r * .18, 4);
}

// ================= layout-dependent data =================
let FLOOR = 0.72, PT0 = 0.13, PT1 = 0.028, SWAMP_WATER = 0.47, SEA = 0.10, LTH = 1;
const LAYERS = [
  { name: 'sand', th: 0.11, c: '#D8B96E', tex: 'dots' }, { name: 'mud', th: 0.09, c: '#8C857A', tex: 'lines' },
  { name: 'sand', th: 0.12, c: '#CFAE62', tex: 'dots' }, { name: 'mud', th: 0.09, c: '#7E776D', tex: 'lines' },
];
let TREES, LEAF, PHOTO, S6, MIC6, O2W, O2IN;
function leafPoint(u, v) { const x = (u - .5) * LEAF.len, y = v * LEAF.wid / 2 * Math.sin(Math.PI * clamp(u)); const c = Math.cos(LEAF.rot), s = Math.sin(LEAF.rot); return [LEAF.cx + x * c - y * s, LEAF.cy + x * s + y * c]; }
function buildLayout() {
  VW = V ? 900 : 1600; VH = V ? 1600 : 900;
  FLOOR = P(.72, .64); PT0 = P(.13, .09); PT1 = P(.028, .02); SWAMP_WATER = P(.47, .42); LTH = P(1, .8);
  const xs = V ? [0.1, 0.3, 0.5, 0.7, 0.9] : [0.05, 0.16, 0.27, 0.39, 0.5, 0.61, 0.72, 0.83, 0.94];
  TREES = xs.map((x, i) => ({ x: x + (hs(i, 1) - .5) * .03, type: i % 2 ? 'fern' : 'scale', h: i % 2 ? .25 + hs(i, 2) * .07 : .4 + hs(i, 3) * .13, dir: hs(i, 4) < .5 ? -1 : 1, delay: hs(i, 5) * .42, phase: hs(i, 6) * 6 }));
  LEAF = V ? { cx: 450, cy: 760, len: 900, wid: 400, rot: -1.45 } : { cx: 640, cy: 430, len: 900, wid: 380, rot: -0.12 };
  PHOTO = Array.from({ length: 9 }, (_, i) => ({ s: .6 + i * .95, y0: V ? 260 + hs(i, 80) * 780 : 180 + hs(i, 80) * 460, entry: leafPoint(.35 + hs(i, 81) * .5, (hs(i, 82) - .5) * 1.2), slot: leafPoint(.12 + i * .085, .28) }));
  S6 = V ? { water: 450, bottom: 1080 } : { water: 250, bottom: 680 };
  const mx = V ? [.12, .31, .5, .69, .88] : Array.from({ length: 7 }, (_, i) => (210 + i * 175) / 1600);
  MIC6 = mx.map((f, i) => [f * VW, S6.bottom - 25 - (i % 2) * 14]);
  O2W = Array.from({ length: 16 }, (_, i) => ({ x: VW * .16 + hs(i, 100) * VW * .6, y: S6.water + 50 + hs(i, 101) * (S6.bottom - S6.water - 150), te: 3 + Math.pow(hs(i, 102), .9) * 11, mic: i % MIC6.length }));
  O2IN = [5.5, 7.6, 9.6].map((e, i) => ({ e, x: VW * (.26 + i * .225), te: [11.6, 12.8, 13.9][i], mic: (i * 3 + 1) % MIC6.length }));
}

// ================= the ground world =================
function worldModel(w) {
  const fall = seg(w, .14, .30), peatify = seg(w, .30, .40), sea = ease(seg(w, .38, .45));
  const sq = ease(seg(w, .58, .82)), today = ease(seg(w, .82, .92)), mine = seg(w, .90, 1);
  const deps = LAYERS.map((_, i) => ease(seg(w, .42 + i * .04, .42 + (i + 1) * .04)));
  return { w, fall, peatify, sea, sq, today, mine, deps, seamTh: lerp(ease(fall) * PT0, PT1, sq), compress: lerp(1, .86, sq),
    heat: ease(seg(w, .56, .64)) * (1 - .7 * ease(seg(w, .84, .92))), press: ease(seg(w, .58, .62)) * (1 - ease(seg(w, .80, .84))) };
}
function drawScaleTree(h, w, cs = 1) {
  ctx.fillStyle = '#6A5436'; ctx.fillRect(-w / 2, -h, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
  for (let y = -h * .08; y > -h; y -= w * 1.3) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w * .35, y - w * .45); ctx.lineTo(0, y - w * .9); ctx.lineTo(-w * .35, y - w * .45); ctx.closePath(); ctx.stroke(); }
  const branch = (x, y, len, ang, d) => {
    const ex = x + Math.sin(ang) * len, ey = y - Math.cos(ang) * len;
    ctx.strokeStyle = '#6A5436'; ctx.lineWidth = Math.max(3, w * .28 * (d + 1)); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
    if (d > 0) { branch(ex, ey, len * .72, ang - .5, d - 1); branch(ex, ey, len * .72, ang + .5, d - 1); }
    else { ctx.fillStyle = '#3E7A37'; ctx.beginPath(); ctx.ellipse(ex, ey, len * .75, len * .55, 0, 0, TAU); ctx.fill(); ctx.fillStyle = '#5E9A45'; ctx.beginPath(); ctx.ellipse(ex - len * .15, ey - len * .15, len * .4, len * .28, 0, 0, TAU); ctx.fill(); }
  };
  branch(0, -h, h * .13 * cs, -.45, 2); branch(0, -h, h * .13 * cs, .45, 2);
}
function drawFern(h, w, cs = 1) {
  const th = h * .72, L = h * .42 * cs; ctx.fillStyle = '#5A4630'; ctx.fillRect(-w * .4, -th, w * .8, th); ctx.lineCap = 'round';
  for (let k = 0; k < 9; k++) { const a = -1.35 + k * (2.7 / 8), ex = Math.sin(a) * L, ey = -th - Math.cos(a) * L * .35 + L * .3, cx = Math.sin(a) * L * .55, cy = -th - L * .55;
    ctx.strokeStyle = '#3E7A37'; ctx.lineWidth = Math.max(3, w * .55); ctx.beginPath(); ctx.moveTo(0, -th); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
    ctx.strokeStyle = '#6BA64F'; ctx.lineWidth = Math.max(1.5, w * .18); ctx.beginPath(); ctx.moveTo(0, -th); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke(); }
}
const treeH = tr => tr.h * VH * P(1, .72);
function drawTree(tr) { tr.type === 'scale' ? drawScaleTree(treeH(tr), P(20, 17), P(1, .8)) : drawFern(treeH(tr), P(20, 17), P(1, .8)); }
function drawWorld(w, lt) {
  const m = worldModel(w), floorY = FLOOR * VH, seamTh = m.seamTh * VH, seamTop = floorY - seamTh;
  const g = ctx.createLinearGradient(0, 0, 0, VH * .55); g.addColorStop(0, mix('#BFD8C0', '#8FC6E8', m.today)); g.addColorStop(1, mix('#E4EBD0', '#D8EEF7', m.today));
  ctx.fillStyle = g; ctx.fillRect(-300, -300, VW + 600, VH + 600);
  sun(...P([140, 110], [VW - 120, 170]), 55);

const CUTS = {

let cut = 'short', SCENES = [], CAPS = [], TOTAL = 0;
function buildCut() {

  TOTAL = acc;
}

function drawScene(s, lt) {

// ================= narration =================
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let narrOn = !!synth, voice = null, spokenIdx = -1;
const voiceSel = $('#voice');
const PREF = ['Google UK English Female', 'Samantha', 'Microsoft Sonia', 'Microsoft Libby', 'Microsoft Aria', 'Microsoft Jenny', 'Serena', 'Karen', 'Moira', 'Google US English', 'Daniel'];
function loadVoices() {
  if (!synth) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang)); if (!vs.length) return;
  const cur = voiceSel.value; voiceSel.innerHTML = '';
  vs.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; voiceSel.appendChild(o); });
  let pick = cur && vs.find(v => v.name === cur);
  if (!pick) for (const n of PREF) { pick = vs.find(v => v.name.startsWith(n)); if (pick) break; }
  pick = pick || vs[0]; voiceSel.value = pick.name; voice = pick;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; voiceSel.addEventListener('change', () => { voice = synth.getVoices().find(v => v.name === voiceSel.value) || null; }); }
else { $('#narrGroup').hidden = true; $('#note').textContent = 'This browser has no built-in voices, so the film plays with captions only.'; }
function speak(text) { if (!synth) return; synth.cancel(); const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.lang = voice ? voice.lang : 'en-GB'; u.rate = cut === 'short' ? 1.08 : 1.0; u.pitch = 1.02; synth.speak(u); }

function resyncSpeech() { if (synth) synth.cancel(); let cur = -1; CAPS.forEach((c, k) => { if (c.t <= T + 1e-6) cur = k; }); spokenIdx = cur - 1; }

// ================= player UI =================
const player = $('#player'), film = $('#film'), capEl = $('#cap'), chapEl = $('#chapter'), playBtn = $('#play'), startBtn = $('#start'), slider = $('#time'), clockEl = $('#clock'), ccBtn = $('#cc');
let playing = false, ccOn = true, lastCap = null, lastChap = null, scrubbing = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const ended = () => T >= TOTAL - .05;
function buildTicks() { const box = $('#ticks'); box.innerHTML = ''; const seen = new Set(); SCENES.forEach(s => { if (s.chapter && !seen.has(s.chapter)) { seen.add(s.chapter); const i = document.createElement('i'); i.style.left = (s.start / TOTAL * 100) + '%'; i.title = s.chapter; box.appendChild(i); } }); }
function setPlaying(v) {

  startBtn.querySelector('span').textContent = ended() ? 'Watch again' : 'Play the story';
}
function seek(t) { T = clamp(t, 0, TOTAL); startBtn.hidden = true; resyncSpeech(); }
playBtn.addEventListener('click', () => setPlaying(!playing));
startBtn.addEventListener('click', () => { setPlaying(true); film.focus(); });
slider.addEventListener('input', () => { scrubbing = true; seek(slider.value / 1000 * TOTAL); });
slider.addEventListener('change', () => { scrubbing = false; });
ccBtn.addEventListener('click', () => { ccOn = !ccOn; ccBtn.setAttribute('aria-pressed', ccOn); capEl.classList.toggle('off', !ccOn); });
$('#fs').addEventListener('click', () => { try { document.fullscreenElement ? document.exitFullscreen() : film.requestFullscreen(); } catch (e) {} });
film.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') seek(T + 5); else if (e.key === 'ArrowLeft') seek(T - 5);
});
function segGroup(id, attr, fn) { const box = $(id); box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); fn(b.dataset[attr]); }); }
segGroup('#cutSegs', 'cut', v => { cut = v; buildCut(); buildTicks(); T = 0; setPlaying(false); startBtn.hidden = false; });
segGroup('#frameSegs', 'frame', v => { V = v === 'v'; player.classList.toggle('v', V); buildLayout(); sizeCaps(); });
segGroup('#narrSegs', 'n', v => { narrOn = v === 'on'; voiceSel.hidden = !narrOn; if (!narrOn && synth) synth.cancel(); else resyncSpeech(); });
function sizeCaps() { const w = film.getBoundingClientRect().width; film.style.setProperty('--capsize', Math.max(14, w * (V ? .05 : .024)) + 'px'); }
new ResizeObserver(sizeCaps).observe(film);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; A += dt;
  if (playing) {
    let nt = T + dt;
    if (narrOn && synth) {
      const n = spokenIdx + 1;
      if (n < CAPS.length && nt >= CAPS[n].t) {
        if (busy()) nt = Math.max(T, CAPS[n].t - .001);   // hold the film until the narrator finishes the previous line
        else { speak(CAPS[n].text); spokenIdx = n; }
      }
    }

  }
  const { i, lt, sc } = render(Math.min(T, TOTAL - .001));

  if (cap !== lastCap) { lastCap = cap; capEl.textContent = cap; capEl.classList.toggle('show', !!cap); }
  if (sc.chapter !== lastChap) { lastChap = sc.chapter; chapEl.textContent = sc.chapter; chapEl.classList.toggle('show', !!sc.chapter); }
  if (!scrubbing) slider.value = Math.round(T / TOTAL * 1000);

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));

})();
